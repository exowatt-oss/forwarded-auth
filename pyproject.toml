[project]
name = "forwarded-auth"
version = "0.1.1"
description = "Typed User from identity headers forwarded by an auth proxy (oauth2-proxy, OIDC, etc.), with JWKS/OIDC verification for FastAPI, Streamlit, and MCP apps."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Exowatt", email = "software@exowatt.com" }]
keywords = ["auth", "oauth2-proxy", "oidc", "fastapi", "streamlit", "mcp", "jwt", "jwks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Typing :: Typed",
]

# PyJWT[crypto] verifies the forwarded bearer token's RSA signature against
# the configured issuer's JWKS. This is the library's defence-in-depth
# against identity-header spoofing: anything that can reach the app
# directly (bypassing the auth proxy) could otherwise set
# `X-Auth-Request-*`-style headers and authenticate as anyone. `crypto`
# pulls in `cryptography`, which backs RS256 verification.
#
# Floor 2.13.0 for GHSA-xgmm-8j9v-c9wx (HIGH): before 2.13.0, PyJWT would
# accept a *public* key JWK as an HMAC secret, letting an attacker who
# knows the public key forge an HS256 token that verifies, whenever a
# caller allows mixed key families in `algorithms=`. This library always
# passes a single explicit `algorithms=["RS256"]`, so it is not itself
# exploitable, but the floor moves so consuming apps inherit the fix too.
dependencies = ["PyJWT[crypto]>=2.13.0"]

[project.urls]
Homepage = "https://github.com/exowatt-oss/forwarded-auth"
Repository = "https://github.com/exowatt-oss/forwarded-auth"
Issues = "https://github.com/exowatt-oss/forwarded-auth/issues"
Changelog = "https://github.com/exowatt-oss/forwarded-auth/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# FastAPI dependency helpers (`forwarded_auth.fastapi`).
fastapi = ["fastapi>=0.100"]
# Streamlit helpers (`forwarded_auth.streamlit`): read `st.context.headers`
# and render the profile widget.
streamlit = ["streamlit>=1.37"]
# `forwarded_auth.mcp.build_transport_security()` needs the MCP SDK's
# `TransportSecuritySettings`. Lazily imported so the base package stays
# usable in apps that don't expose an MCP surface.
#
# Floor 1.28.1 for GHSA-vj7q-gjh5-988w (HIGH): the SDK's WebSocket server
# transport did not validate Host/Origin — the exact DNS-rebinding class
# of hole `build_transport_security()` exists to close for the HTTP
# transports. Raising the extra's floor is what makes MCP-surface apps
# pick the fix up when they refresh `forwarded-auth[mcp]`.
mcp = ["mcp>=1.28.1"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fastapi>=0.100",
    "starlette>=1.3.1",
    "httpx>=0.27",
    "mcp>=1.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forwarded_auth"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
